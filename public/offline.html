<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mios</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
        background: #0b0b0d; color: #f4f4f5; font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: #a1a1aa; max-width: 280px; }
      button {
        margin-top: 8px; border: 0; border-radius: 999px; padding: 12px 28px; font: inherit; font-weight: 600;
        background: #c6f432; color: #0b0b0d;
      }
    </style>
  </head>
  <body>
    <!-- Shown by the iPhone app when the live site can't load (no connection). -->
    <img src="icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>Mios necesita internet para abrir. Revisa tu conexión e inténtalo de nuevo.</p>
    <button onclick="location.href = 'https://personal-management-board-vercel.vercel.app/'">Reintentar</button>
  </body>
</html>
